server:
  port: 8090

spring:
  datasource:
    url: jdbc:mysql://localhost:3307/naverpay?serverTimezone=Asia/Seoul
    username: naverpay
    password: externship
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
  cloud:
    stream:
      bindings:
        shortUrlClicked-out-0:
          destination: short_url.clicked
          content-type: application/json
          producer:
            partition-count: 3
        shortUrlCreated-out-0:
          destination: short_url.created
          content-type: application/json
          producer:
            partition-count: 3

      kafka:
        binder:
          brokers: localhost:29092, localhost:29093, localhost:29094
          auto-create-topics: false
          required-acks: 0
          configuration:
            key.serializer: org.apache.kafka.common.serialization.StringSerializer
        bindings:
          shortUrlClicked-out-0:
            producer:
              sync: false
          shortUrlCreated-out-0:
            producer:
              sync: false
