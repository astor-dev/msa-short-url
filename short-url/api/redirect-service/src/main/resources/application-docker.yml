server:
  port: 8082

spring:
  datasource:
    url: jdbc:mysql://mysql:3306/naverpay?serverTimezone=Asia/Seoul
    username: naverpay
    password: externship
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      host: redis
      port: 6379
  jpa:
    hibernate:
      ddl-auto: update
  cloud:
    stream:
      bindings:
        shortUrlClicked-out-0:
          destination: short_url.clicked
          content-type: application/json
          producer:
            partition-count: 3
      kafka:
        binder:
          brokers: broker-1:19092, broker-2:19092, broker-3:19092
          auto-create-topics: false
          required-acks: 0
          configuration:
            key.serializer: org.apache.kafka.common.serialization.StringSerializer
        bindings:
            shortUrlClicked-out-0:
                producer:
                  sync: false