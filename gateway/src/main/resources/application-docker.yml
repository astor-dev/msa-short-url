server:
  port: 8080

spring:
  data:
    redis:
      host: redis
      port: 6379
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: url-create
              uri: http://url-service:8081
              predicates:
                - Path=/api/v1/urls
                - Method=POST
              filters:
                - RewritePath=/api/(?<segment>.*), /${segment}

            - id: url-redirect
              uri: http://redirect-service:8082
              predicates:
                - Path=/{shortKey}
              filters:
                - RewritePath=/(?<key>.*), /v1/urls/${key}

            - id: url-state
              uri: http://stats-service:8083
              predicates:
                - Path=/api/v1/urls/{shortKey}
                - Method=GET
              filters:
                - RewritePath=/api/(?<segment>.*), /${segment}

            - id: url-statistics
              uri: http://stats-service:8083
              predicates:
                - Path=/api/v1/urls/{shortKey}/statistics
                - Method=GET
              filters:
                - RewritePath=/api/(?<segment>.*), /${segment}

            - id: top-statistics
              uri: http://stats-service:8083
              predicates:
                - Path=/api/v1/statistics/top
                - Method=GET
              filters:
                - RewritePath=/api/(?<segment>.*), /${segment}