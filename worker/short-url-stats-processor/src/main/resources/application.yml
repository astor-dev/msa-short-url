server:
  port: 8091

spring:
  datasource:
    url: jdbc:mysql://localhost:3307/naverpay?serverTimezone=Asia/Seoul
    username: naverpay
    password: externship
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      host: localhost
      port: 6380
    mongodb:
      uri: mongodb://naverpay:externship@localhost:27018/naverpay?authSource=admin
  cloud:
    stream:
      bindings:
        shortUrlCreated-in-0:
          destination: short_url.created
          group: short-url.stats-processor
          consumer:
            concurrency: 3
      kafka:
        binder:
          brokers: localhost:29092, localhost:29093, localhost:29094
          auto-create-topics: false
          required-acks: 0
          configuration:
            key.serializer: org.apache.kafka.common.serialization.StringSerializer
        bindings:
          shortUrlCreated-in-0:
            consumer:
              start-offset: latest