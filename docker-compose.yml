networks:
  naverpay-network:
    name: naverpay-network
    driver: bridge

services:
  mysql:
    image: 'mysql:8.0.44'
    container_name: mysql
    ports:
      - "3307:3306"
    environment:
      - MYSQL_ROOT_PASSWORD=externship
      - MYSQL_DATABASE=naverpay
      - MYSQL_USER=naverpay
      - MYSQL_PASSWORD=externship
    volumes:
      - ./.data/mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-pexternship"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - naverpay-network

  mongodb:
    image: 'mongo:7.0.26'
    container_name: mongodb
    ports:
      - "27018:27017"
    environment:
      - MONGO_INITDB_ROOT_USERNAME=naverpay
      - MONGO_INITDB_ROOT_PASSWORD=externship
    volumes:
      - ./.data/mongodb:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - naverpay-network

  redis:
    image: 'redis:7.4.7'
    container_name: redis
    ports:
      - "6380:6379"
    volumes:
      - ./.data/redis:/data
    networks:
      - naverpay-network

  controller-1:
    image: apache/kafka:4.1.1
    container_name: controller-1
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: controller
      KAFKA_LISTENERS: CONTROLLER://:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@controller-1:9093,2@controller-2:9093,3@controller-3:9093
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    volumes:
      - ./.data/controller-1:/var/lib/kafka/data
    networks:
      - naverpay-network

  controller-2:
    image: apache/kafka:4.1.1
    container_name: controller-2
    environment:
      KAFKA_NODE_ID: 2
      KAFKA_PROCESS_ROLES: controller
      KAFKA_LISTENERS: CONTROLLER://:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@controller-1:9093,2@controller-2:9093,3@controller-3:9093
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    volumes:
      - ./.data/controller-2:/var/lib/kafka/data
    networks:
      - naverpay-network

  controller-3:
    image: apache/kafka:4.1.1
    container_name: controller-3
    environment:
      KAFKA_NODE_ID: 3
      KAFKA_PROCESS_ROLES: controller
      KAFKA_LISTENERS: CONTROLLER://:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@controller-1:9093,2@controller-2:9093,3@controller-3:9093
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    volumes:
      - ./.data/controller-3:/var/lib/kafka/data
    networks:
      - naverpay-network

  broker-1:
    image: apache/kafka:4.1.1
    container_name: broker-1
    ports:
      - 29092:9092
    environment:
      KAFKA_NODE_ID: 4
      KAFKA_PROCESS_ROLES: broker
      KAFKA_LISTENERS: 'PLAINTEXT://:19092,PLAINTEXT_HOST://:9092'
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://broker-1:19092,PLAINTEXT_HOST://localhost:29092'
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@controller-1:9093,2@controller-2:9093,3@controller-3:9093
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'true'
      KAFKA_MIN_INSYNC_REPLICAS: 2
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_DEFAULT_REPLICATION_FACTOR: 3
      KAFKA_LOG_RETENTION_HOURS: 336
    volumes:
      - ./.data/broker-1:/var/lib/kafka/data
    depends_on:
      - controller-1
      - controller-2
      - controller-3
    networks:
      - naverpay-network

  broker-2:
    image: apache/kafka:4.1.1
    container_name: broker-2
    ports:
      - 39092:9092
    environment:
      KAFKA_NODE_ID: 5
      KAFKA_PROCESS_ROLES: broker
      KAFKA_LISTENERS: 'PLAINTEXT://:19092,PLAINTEXT_HOST://:9092'
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://broker-2:19092,PLAINTEXT_HOST://localhost:39092'
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@controller-1:9093,2@controller-2:9093,3@controller-3:9093
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'true'
      KAFKA_MIN_INSYNC_REPLICAS: 2
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_DEFAULT_REPLICATION_FACTOR: 3
      KAFKA_LOG_RETENTION_HOURS: 336
    volumes:
      - ./.data/broker-2:/var/lib/kafka/data
    depends_on:
      - controller-1
      - controller-2
      - controller-3
    networks:
      - naverpay-network

  broker-3:
    image: apache/kafka:4.1.1
    container_name: broker-3
    ports:
      - 49092:9092
    environment:
      KAFKA_NODE_ID: 6
      KAFKA_PROCESS_ROLES: broker
      KAFKA_LISTENERS: 'PLAINTEXT://:19092,PLAINTEXT_HOST://:9092'
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://broker-3:19092,PLAINTEXT_HOST://localhost:49092'
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@controller-1:9093,2@controller-2:9093,3@controller-3:9093
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'true'
      KAFKA_MIN_INSYNC_REPLICAS: 2
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_DEFAULT_REPLICATION_FACTOR: 3
      KAFKA_LOG_RETENTION_HOURS: 336
    volumes:
      - ./.data/broker-3:/var/lib/kafka/data
    depends_on:
      - controller-1
      - controller-2
      - controller-3
    networks:
      - naverpay-network

  kafka-ui:
    image: 'provectuslabs/kafka-ui:v0.7.2'
    container_name: kafka-ui
    ports:
      - "9000:8080"
    environment:
      - KAFKA_CLUSTERS_0_NAME=local
      - KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS=broker-1:19092,broker-2:19092,broker-3:19092
    depends_on:
      - controller-1
      - controller-2
      - controller-3
      - broker-1
      - broker-2
      - broker-3
    networks:
      - naverpay-network

  gateway:
    build:
      context: .
      dockerfile: Dockerfile
      target: gateway
    container_name: gateway
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
    restart: on-failure:3
    depends_on:
      - url-service
      - redirect-service
      - stats-service
    networks:
      - naverpay-network

  url-service:
    build:
      context: .
      dockerfile: Dockerfile
      target: url-service
    container_name: url-service
    environment:
      - SPRING_PROFILES_ACTIVE=docker
    restart: on-failure:3
    depends_on:
      - mysql
      - redis
      - broker-1
      - broker-2
      - broker-3
      - outbox-worker
    networks:
      - naverpay-network

  redirect-service:
    build:
      context: .
      dockerfile: Dockerfile
      target: redirect-service
    container_name: redirect-service
    environment:
      - SPRING_PROFILES_ACTIVE=docker
    restart: on-failure:3
    depends_on:
      - mysql
      - redis
      - broker-1
      - broker-2
      - broker-3
      - url-service
    networks:
      - naverpay-network

  stats-service:
    build:
      context: .
      dockerfile: Dockerfile
      target: stats-service
    container_name: stats-service
    environment:
      - SPRING_PROFILES_ACTIVE=docker
    restart: on-failure:3
    depends_on:
      - mongodb
      - redis
      - broker-1
      - broker-2
      - broker-3
      - redirect-service
    networks:
      - naverpay-network

  short-url-stats-consumer:
    build:
      context: .
      dockerfile: Dockerfile
      target: short-url-stats-consumer
    container_name: short-url-stats-consumer
    environment:
      - SPRING_PROFILES_ACTIVE=docker
    restart: on-failure:3
    depends_on:
      - mysql
      - redis
      - mongodb
      - broker-1
      - broker-2
      - broker-3
      - stats-service
    networks:
      - naverpay-network

  outbox-worker:
    build:
      context: .
      dockerfile: Dockerfile
      target: outbox-worker
    container_name: outbox-worker
    environment:
      - SPRING_PROFILES_ACTIVE=docker
    restart: on-failure:3
    depends_on:
      - mysql
      - broker-1
      - broker-2
      - broker-3
    networks:
      - naverpay-network